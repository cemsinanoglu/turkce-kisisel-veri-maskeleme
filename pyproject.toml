[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-kisisel-veri-maskeleme"
version = "0.1.0"
description = "Offline Turkish PII masking (TCKN, VKN, IBAN, phone, address, names) that keeps suffixes and restores AI answers."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Av. Cem Sinanoğlu"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["kvkk", "pii", "anonymization", "redaction", "turkish", "privacy"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Turkish",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing",
]

[project.scripts]
turkce-maske = "kvkk_maske:main"
turkce-maske-pano = "pano_maskele:main"

[tool.setuptools]
py-modules = ["kvkk_maske", "pano_maskele"]
